<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2457a6">
<title>学習管理アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#182235;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#2457a6;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0}main{max-width:950px;margin:18px auto;padding:0 14px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #17255412}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;max-width:100%}input,select,textarea{width:100%;margin:5px 0 12px}button{background:#2457a6;color:white;border:0;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e8eef8;color:#1e3a65}button.danger{background:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hidden{display:none!important}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.student{border:1px solid #dbe3ef;border-radius:10px;padding:12px;margin:8px 0}.task{border-left:6px solid #477bd1;background:#f7f9fc;padding:10px;margin:8px 0;border-radius:8px}.task.done{opacity:.6}.task.done .taskname{text-decoration:line-through}.day{font-weight:700;color:#2457a6;margin-top:14px}.pill{display:inline-block;background:#e8eef8;border-radius:20px;padding:3px 9px;font-size:12px}.notice{background:#fff7df;padding:10px;border-radius:8px;font-size:13px}.stamp{font-size:24px}
</style>
</head>
<body>
<header><h1>📚 学習管理アプリ</h1><button id="logout" class="secondary hidden">ログアウト</button></header>
<main>
<section id="login" class="card">
<h2>ログイン</h2>
<p class="muted">先生・生徒共通のログイン画面です。</p>
<label>メールアドレス<input id="email" type="email" autocomplete="username" placeholder="メールアドレス"></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password" placeholder="パスワード"></label>
<button id="loginBtn">ログイン</button>
<div id="msg" class="muted" aria-live="polite"></div>
<p class="notice">生徒は先に先生からアカウント登録・割り当てを受けてください。新規登録はFirebase Authenticationで行います。</p>
</section>
<section id="teacher" class="hidden">
<div class="card"><h2>先生用メニュー</h2><p class="muted">生徒の登録、週間予定、確認コメントを管理します。</p></div>
<div class="card"><h3>生徒を追加・登録</h3>
<div class="grid"><label>生徒名<input id="newName" placeholder="例：山田 太郎"></label><label>生徒のログインUID<input id="newUid" placeholder="生徒がログイン後に表示されるUID"></label></div>
<button id="addStudent">生徒を登録</button><p class="muted">生徒は先にFirebase Authenticationでメール・パスワードのアカウントを作成し、初回ログイン後に表示されるUIDを先生に伝えます。</p><div id="teacherMsg" class="muted"></div>
</div>
<div class="card"><h3>生徒一覧</h3><div id="students"></div></div>
<div id="editor" class="card hidden">
<h3 id="editTitle">週間スケジュール</h3>
<label>対象週<input id="week" type="date"></label>
<h4>予定を追加</h4>
<div class="grid">
<label>曜日<select id="day"><option value="月">月曜日</option><option value="火">火曜日</option><option value="水">水曜日</option><option value="木">木曜日</option><option value="金">金曜日</option><option value="土">土曜日</option><option value="日">日曜日</option></select></label>
<label>開始時刻<input id="start" type="time" value="17:00"></label>
<label>時間<select id="duration"><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select>分</label>
<label>学習内容<input id="content" placeholder="例：算数・計算練習"></label>
</div>
<button id="addTask">予定を追加</button>
<div id="taskList"></div>
<h4>先生からの確認</h4>
<label>コメント<textarea id="comment" rows="2" placeholder="今日の頑張り・次回へのアドバイス"></textarea></label>
<label>スタンプ<select id="stamp"><option value="">なし</option><option>🌟</option><option>💮</option><option>👏</option><option>😊</option><option>🔥</option><option>🎉</option></select></label>
<button id="saveWeek">この週の内容を保存</button><div id="saveMsg" class="muted"></div>
</div>
</section>
<section id="student" class="hidden">
<div class="card"><h2 id="studentTitle">今週の学習予定</h2><label>週を選択<input id="studentWeek" type="date"></label><div class="muted">終わった学習にチェックを入れてください。</div></div>
<div class="card"><div id="studentTasks"></div></div>
<div class="card"><h3>先生からのコメント</h3><div id="studentComment"></div></div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBG2tJ_hbxGippHchKfpJIF1CkbG1K32aw",authDomain:"kanri-apr.firebaseapp.com",projectId:"kanri-apr",storageBucket:"kanri-apr.firebasestorage.app",messagingSenderId:"593448714525",appId:"1:593448714525:web:d14c897d4696aeb121a1f4"};
const TEACHER_UID="HsxxFZpIFmXzQP5a9AZKkoQJDUS2";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let currentUser=null,selectedStudent=null,studentProfile=null,tasks=[];
const mondayOf=(v)=>{let d=new Date((v||new Date().toISOString().slice(0,10))+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toISOString().slice(0,10)};
const weekKey=()=>mondayOf($("week").value);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(id){["login","teacher","student"].forEach(x=>$(x).classList.toggle("hidden",x!==id));$("logout").classList.toggle("hidden",id==="login")}
$("loginBtn").onclick=async()=>{try{$("msg").textContent="ログイン中…";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("msg").textContent="ログインできませんでした："+e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){show("login");return} $("logout").classList.remove("hidden");if(user.uid===TEACHER_UID){show("teacher");$("week").value=mondayOf();await loadStudents()}else{try{let u=await getDoc(doc(db,"users",user.uid));if(!u.exists()||!u.data().studentId){show("login");$("msg").textContent="先生による生徒登録がまだ完了していません。UID："+user.uid;return}studentProfile=u.data();show("student");$("studentWeek").value=mondayOf();await loadStudentWeek()}catch(e){show("login");$("msg").textContent="データを読み込めません："+e.message}}});
function defaultTasks(){return [
{day:"月",start:"17:00",duration:90,content:"算数 授業"},{day:"月",start:"18:35",duration:90,content:"理科 授業"},{day:"月",start:"20:10",duration:15,content:"国語 漢字・語句"},{day:"月",start:"20:25",duration:15,content:"計算 練習"},{day:"月",start:"20:40",duration:30,content:"算数 授業の直し"},{day:"月",start:"21:10",duration:30,content:"理科 授業の直し"},
{day:"火",start:"17:00",duration:60,content:"算数 宿題"},{day:"火",start:"18:00",duration:30,content:"理科 宿題"},{day:"火",start:"18:35",duration:15,content:"国語 漢字・語句"},{day:"火",start:"18:50",duration:60,content:"国語 宿題"},{day:"火",start:"19:50",duration:15,content:"理科 暗記"},
{day:"水",start:"17:00",duration:60,content:"算数 宿題"},{day:"水",start:"18:00",duration:30,content:"計算 授業の直し"},{day:"水",start:"18:35",duration:15,content:"国語 漢字・語句"},{day:"水",start:"18:50",duration:15,content:"計算 練習"},{day:"水",start:"19:05",duration:15,content:"理科 暗記"},
{day:"木",start:"17:00",duration:15,content:"国語 漢字・語句"},{day:"木",start:"17:15",duration:15,content:"計算 練習"},{day:"木",start:"17:30",duration:15,content:"理科 暗記"},
{day:"金",start:"17:00",duration:15,content:"国語 漢字・語句"},{day:"金",start:"17:15",duration:15,content:"計算 練習"},{day:"金",start:"17:30",duration:15,content:"理科 暗記"},{day:"金",start:"17:45",duration:45,content:"算数 宿題"},{day:"金",start:"18:35",duration:60,content:"国語 宿題"},{day:"金",start:"19:35",duration:30,content:"理科 宿題"},{day:"金",start:"20:10",duration:45,content:"算数 直し"},
{day:"土",start:"17:00",duration:90,content:"国語 授業"},{day:"土",start:"18:35",duration:45,content:"国語 授業の直し"},{day:"土",start:"19:20",duration:30,content:"算数 宿題"},{day:"土",start:"19:50",duration:15,content:"計算 練習"},{day:"土",start:"20:10",duration:45,content:"理科 宿題"},
{day:"日",start:"17:00",duration:45,content:"算数 宿題"},{day:"日",start:"17:45",duration:45,content:"国語 宿題"},{day:"日",start:"18:35",duration:45,content:"理科 直し"}
]}
async function loadStudents(){let snap=await getDocs(collection(db,"students"));let wk=mondayOf();for(const s of snap.docs){let ref=doc(db,"students",s.id,"weeks",wk),ws=await getDoc(ref);if(!ws.exists()||!Array.isArray(ws.data().tasks)){await setDoc(ref,{tasks:defaultTasks(),comment:"",stamp:"",updatedAt:serverTimestamp()},{merge:true})}}$("students").innerHTML="";snap.forEach(s=>{let d=s.data(),el=document.createElement("div");el.className="student";el.innerHTML=`<b>${esc(d.name)}</b><div class="muted">登録ID：${esc(s.id)}</div><button>週間予定を編集</button>`;el.querySelector("button").onclick=()=>openEditor(s.id,d.name);$("students").append(el)})}
$("addStudent").onclick=async()=>{let name=$("newName").value.trim(),uid=$("newUid").value.trim();if(!name||!uid){$("teacherMsg").textContent="生徒名とUIDを入力してください。";return}try{let studentId=uid;await setDoc(doc(db,"students",studentId),{name,createdAt:serverTimestamp()},{merge:true});await setDoc(doc(db,"users",uid),{studentId,role:"student"});$("teacherMsg").textContent="生徒を登録しました。";$("newName").value="";$("newUid").value="";await loadStudents()}catch(e){$("teacherMsg").textContent="登録エラー："+e.message}};
async function openEditor(id,name){selectedStudent=id;$("editor").classList.remove("hidden");$("editTitle").textContent=name+" さんの週間スケジュール";$("week").value=mondayOf();await loadTeacherWeek();$("editor").scrollIntoView({behavior:"smooth"})}
async function loadTeacherWeek(){let ref=doc(db,"students",selectedStudent,"weeks",weekKey()),s=await getDoc(ref);let d=s.exists()?s.data():{};if(!s.exists()||!Array.isArray(d.tasks)){d={...d,tasks:defaultTasks()};await setDoc(ref,{tasks:d.tasks,comment:d.comment||"",stamp:d.stamp||"",updatedAt:serverTimestamp()},{merge:true})}tasks=d.tasks||[];$("comment").value=d.comment||"";$("stamp").value=d.stamp||"";renderTeacherTasks()}
$("week").onchange=()=>{if(selectedStudent)loadTeacherWeek()};
$("addTask").onclick=()=>{let content=$("content").value.trim();if(!content)return;tasks.push({day:$("day").value,start:$("start").value,duration:Number($("duration").value),content});$("content").value="";renderTeacherTasks()};
function renderTeacherTasks(){$("taskList").innerHTML=tasks.map((t,i)=>`<div class="task"><b>${esc(t.day)} ${esc(t.start)}</b>・${t.duration}分　${esc(t.content)} <button class="danger" data-i="${i}">削除</button></div>`).join("");$("taskList").querySelectorAll("button").forEach(b=>b.onclick=()=>{tasks.splice(Number(b.dataset.i),1);renderTeacherTasks()})}
$("saveWeek").onclick=async()=>{try{await setDoc(doc(db,"students",selectedStudent,"weeks",weekKey()),{tasks,comment:$("comment").value,stamp:$("stamp").value,updatedAt:serverTimestamp()},{merge:true});$("saveMsg").textContent="保存しました。";}catch(e){$("saveMsg").textContent="保存エラー："+e.message}};
$("studentWeek").onchange=loadStudentWeek;
async function loadStudentWeek(){if(!studentProfile)return;let st=await getDoc(doc(db,"students",studentProfile.studentId));$("studentTitle").textContent=(st.exists()?st.data().name:"")+" さんの学習予定";let w=mondayOf($("studentWeek").value);$("studentWeek").value=w;let s=await getDoc(doc(db,"students",studentProfile.studentId,"weeks",w));let d=s.exists()?s.data():{};let progress=d.progress||{};let arr=d.tasks||[];$("studentTasks").innerHTML=arr.length?arr.map((t,i)=>`<div class="task ${progress[i]?"done":""}"><label><input type="checkbox" data-i="${i}" ${progress[i]?"checked":""} style="width:auto"> <span class="taskname"><b>${esc(t.day)} ${esc(t.start)}</b>・${t.duration}分　${esc(t.content)}</span></label></div>`).join(""):"この週の予定はまだ登録されていません。";$("studentTasks").querySelectorAll("input").forEach(c=>c.onchange=async()=>{let p={...progress,[c.dataset.i]:c.checked};try{await updateDoc(doc(db,"students",studentProfile.studentId,"weeks",w),{progress:p});c.closest(".task").classList.toggle("done",c.checked)}catch(e){alert("チェックを保存できません："+e.message);c.checked=!c.checked}});$("studentComment").innerHTML=`<div class="stamp">${esc(d.stamp||"")}</div>${esc(d.comment||"先生からのコメントはまだありません。")}`}
</script>
</body></html>
